<div id="app"></div>
<script>
(()=>{'use strict';
const STORAGE_KEY='takken_keshite_v1_cards';
const APP_VERSION=1;
const seed=[
 {id:'rights-agency-14',subject:'権利関係',unit:'代理・表見代理',title:'問題14｜表見代理等',source:'2026年度版 みんなが欲しかった！宅建士の論点別過去問題集',reference:'H18 問2',pages:'254〜255',kind:'choose-wrong',stem:'AはBの代理人として、B所有の甲土地をCに売り渡す売買契約をCと締結した。しかし、Aは甲土地を売り渡す代理権は有していなかった。この場合に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはどれか。',choices:[
  {label:'(1)',text:'BがCに対し、Aは甲土地の売却に関する代理人であると表示していた場合、Aに甲土地を売り渡す具体的な代理権はないことをCが過失により知らなかったときは、BC間の本件売買契約は有効となる。',correct:false,cue:'本人Bの表示 ／ Cに過失 → 表見代理×'},
  {label:'(2)',text:'BがAに対し、甲土地に抵当権を設定する代理権を与えているが、Aの売買契約締結行為は権限外の行為となる場合、甲土地を売り渡す具体的な代理権がAにあるとCが信ずべき正当な理由があるときは、BC間の本件売買契約は有効となる。',correct:true,cue:'抵当権設定代理権 ／ 売買 ／ 正当理由 → 表見代理○'},
  {label:'(3)',text:'Bが本件売買契約を追認しない間は、Cはこの契約を取り消すことができる。ただし、Cが契約の時において、Aに甲土地を売り渡す具体的な代理権がないことを知っていた場合は取り消せない。',correct:true,cue:'追認前 ／ 善意C → 取消○ ／ 悪意C → ×'},
  {label:'(4)',text:'Bが本件売買契約を追認しない場合、Aは、Cの選択に従い、Cに対して契約履行又は損害賠償の責任を負う。ただし、Cが契約の時において、Aに甲土地を売り渡す具体的な代理権がないことを知っていた場合は責任を負わない。',correct:true,cue:'追認なし ／ 無権代理人責任 ／ 履行 or 賠償 ／ 相手方悪意→免責'}],answer:'(1)',core:['表見代理：本人の表示だけでは不足／相手方の過失に注意','権限外：基本代理権 ＋ 相手方の正当理由','無権代理：追認前／善意の相手方は取消可','無権代理人責任：履行または賠償／例外あり'],drills:[
 {id:'d1',prompt:'本人BがAを売却代理人だとCに示した。Cが注意すればAに権限がないと分かった。このとき表見代理が成立する。',correct:false,explanation:'Cに過失あり → 表見代理は成立しない。'},
 {id:'d2',prompt:'BはAに抵当権設定の代理権だけを与えた。Aが土地を売却したが、Cには売却代理権があると信じる正当な理由がある。権限外の表見代理が成立しうる。',correct:true,explanation:'基本代理権 ＋ 権限外の売買 ＋ 正当理由。'},
 {id:'d3',prompt:'無権代理の相手方Cは、契約時に無権限を知っていた場合でも、Bの追認前なら契約を取り消せる。',correct:false,explanation:'取消しは、契約時に無権限を知らなかった相手方に認められる。'},
 {id:'d4',prompt:'本人が追認しなかった無権代理行為について、相手方が契約時に無権限を知っていれば、原則として無権代理人への履行・賠償請求はできない。',correct:true,explanation:'相手方の悪意は無権代理人の責任の免責事由。'}],status:'unseen',attempts:0,correctAnswers:0,lastReviewed:null},
 {id:'rights-agency-15',subject:'権利関係',unit:'代理・表見代理',title:'問題15｜代理・表見代理',source:'2026年度版 みんなが欲しかった！宅建士の論点別過去問題集',reference:'H26 問2 改題',pages:'256〜257',kind:'count-wrong',stem:'代理に関する次の記述のうち、民法の規定及び判例によれば、誤っているものはいくつあるか。',choices:[
  {label:'ア',text:'代理権を有しない者がした契約を本人が追認する場合、その契約の効力は、別段の意思表示がない限り、追認をした時から将来に向かって生ずる。',correct:false,cue:'追認 ／ 遡及 ／ 契約時から'},
  {label:'イ',text:'不動産を担保に金員を借り入れる代理権を与えられた代理人が、本人の名において当該不動産を売却した場合、相手方において本人自身の行為であると信じたことについて正当な理由があるときは、表見代理の規定を類推適用することができる。',correct:true,cue:'担保借入代理権 ／ 売却 ／ 正当理由 → 類推適用'},
  {label:'ウ',text:'代理人は、行為能力者であることを要しないが、代理人が後見開始の審判を受けたときは、代理権が消滅する。',correct:true,cue:'代理人：行為能力不要 ／ 後見開始 → 代理権消滅'},
  {label:'エ',text:'代理人が相手方にした意思表示の効力が意思の不存在、錯誤、詐欺、強迫又はある事情を知っていたこと若しくは知らなかったことにつき過失があったことによって影響を受けるべき場合には、その事実の有無は、本人の選択に従い、本人又は代理人のいずれかについて決する。',correct:false,cue:'瑕疵 ／ 知不知 ／ 過失 → 代理人基準'}],answer:'(2) 二つ（ア・エ）',core:['追認：原則、契約時へ遡及（第三者の権利を害せない）','代理人：行為能力は不要／後見開始で代理権消滅','意思表示の瑕疵・知不知・過失：原則、代理人基準','表見代理：権限外行為＋正当理由（事例によって類推適用）'],drills:[
 {id:'d1',prompt:'本人が無権代理行為を追認すると、原則として効力は追認した時から将来に向かって生じる。',correct:false,explanation:'原則として、契約時までさかのぼって効力が生じる。'},
 {id:'d2',prompt:'代理人は行為能力者である必要はないが、代理人が後見開始の審判を受けると代理権は消滅する。',correct:true,explanation:'代理人の行為能力は不要／後見開始は代理権消滅事由。'},
 {id:'d3',prompt:'代理人が行った意思表示について錯誤や詐欺が問題となるとき、その事実は原則として本人と代理人のどちらかを本人が選んで判断する。',correct:false,explanation:'原則として、代理人を基準に判断する。'},
 {id:'d4',prompt:'不動産の担保借入れの代理権だけを与えられた代理人が、その不動産を売却した。相手方に正当な理由があれば表見代理の規定の類推適用が問題となる。',correct:true,explanation:'元の問題イに対応。与えた代理権の範囲・相手方の正当理由を確認。'}],status:'unseen',attempts:0,correctAnswers:0,lastReviewed:null}
];

const esc=(s)=>String(s??'').replace(/[&<>"']/g,(x)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const clone=(x)=>JSON.parse(JSON.stringify(x));
const validStatus=['unseen','good','mid','bad'];
function normalizeCard(x){
 if(!x||typeof x!=='object')throw Error('カードはオブジェクトで指定してください。');
 if(!/^[a-zA-Z0-9_-]{3,80}$/.test(x.id||''))throw Error('id は英数字・-・_ の3〜80文字で指定してください。');
 for(const k of ['title','stem','subject','unit'])if(typeof x[k]!=='string'||!x[k].trim())throw Error(`${x.id}: ${k} が必要です。`);
 if(!Array.isArray(x.choices)||!x.choices.length)throw Error(`${x.id}: choices が必要です。`);
 if(!Array.isArray(x.drills)||!x.drills.length)throw Error(`${x.id}: drills が必要です。`);
 const ch=x.choices.map((v,i)=>({label:String(v.label||i+1).slice(0,20),text:String(v.text||''),correct:typeof v.correct==='boolean'?v.correct:null,cue:String(v.cue||'')}));
 const drills=x.drills.map((d,i)=>{if(typeof d.correct!=='boolean')throw Error(`${x.id}: drills[${i}].correct は true/false で指定してください。`);return{id:String(d.id||'d'+(i+1)),prompt:String(d.prompt||''),correct:d.correct,explanation:String(d.explanation||'')}});
 return{id:x.id,title:x.title.trim().slice(0,160),subject:x.subject.trim(),unit:x.unit.trim(),source:String(x.source||''),reference:String(x.reference||''),pages:String(x.pages||''),kind:String(x.kind||'other'),stem:String(x.stem),choices:ch,answer:String(x.answer||''),core:Array.isArray(x.core)?x.core.map(String):[],drills,status:validStatus.includes(x.status)?x.status:'unseen',attempts:Number.isFinite(Number(x.attempts))?Number(x.attempts):0,correctAnswers:Number.isFinite(Number(x.correctAnswers))?Number(x.correctAnswers):0,lastReviewed:typeof x.lastReviewed==='string'?x.lastReviewed:null};
}
let canPersist=true;
function load(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){
   const parsed=JSON.parse(raw);
   if(Array.isArray(parsed)&&parsed.length){
    const saved=parsed.map(normalizeCard);
    for(const c of seed)if(!saved.some(v=>v.id===c.id))saved.push(clone(c));
    return saved;
   }
  }
 }catch(e){canPersist=false;}
 return clone(seed);
}
let cards=load();
let state={view:'cards',selected:cards[0]?.id||'',search:'',subject:'all',status:'all',reveal:{},answers:{},practice:[],practiceIndex:0,practiceAnswer:null,practiceScore:0,importText:'',mobileMode:'list',sheetTab:'problem'};
const isMobile=()=>window.matchMedia('(max-width:760px)').matches;
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(cards));canPersist=true;return true}catch(e){canPersist=false;toast('このブラウザでは保存に失敗しました。JSONでバックアップしてください。',true);return false}}
function toast(msg,error=false){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast'+(error?' error':'');d.textContent=msg;document.body.append(d);setTimeout(()=>d.remove(),3700)}
// Load new study cards published in GitHub Pages; preserve each user's review progress.
async function syncPublishedCards(){
 try{
  const response=await fetch('./data/cards.json',{cache:'no-store'});
  if(!response.ok)throw Error('公開カードを取得できませんでした');
  const payload=await response.json();
  const list=Array.isArray(payload)?payload:payload?.cards;
  if(!Array.isArray(list))throw Error('公開カードの形式が正しくありません');
  const fresh=list.map(normalizeCard);
  const ids=new Set();
  for(const c of fresh){
   if(ids.has(c.id))throw Error('公開カードにIDの重複があります');
   ids.add(c.id);
  }
  let changed=false;
  for(const c of fresh){
   const idx=cards.findIndex(v=>v.id===c.id);
   if(idx<0){cards.push(c);changed=true;continue;}
   const old=cards[idx];
   const merged={...c,status:old.status,attempts:old.attempts,correctAnswers:old.correctAnswers,lastReviewed:old.lastReviewed};
   if(JSON.stringify(merged)!==JSON.stringify(old)){cards[idx]=merged;changed=true;}
  }
  if(changed){save();render();}
 }catch(err){console.warn('公開カードの同期をスキップ:',err);}
}
function dateText(x){return x?new Date(x).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'}):'未実施'}
function counts(){return{total:cards.length,done:cards.filter(x=>x.status==='good').length,review:cards.filter(x=>x.status==='bad'||x.status==='mid').length,drills:cards.reduce((a,c)=>a+c.drills.length,0)}}
function badge(s){return{s:'',unseen:'未判定',good:'○',mid:'△',bad:'×'}[s]||'未判定'}
function cssStatus(s){return{s:'',good:'good',mid:'mid',bad:'bad'}[s]||''}
function filtered(){return cards.filter(x=>(state.subject==='all'||x.subject===state.subject)&&(state.status==='all'||x.status===state.status)&&(!state.search||(x.title+x.unit+x.stem+x.reference+x.pages+x.core.join(' ')).toLowerCase().includes(state.search.toLowerCase())))}
function current(){const visible=filtered();if(!visible.find(x=>x.id===state.selected))state.selected=visible[0]?.id||'';return cards.find(x=>x.id===state.selected)}
const app=document.getElementById('app');
function render(){const c=counts();app.innerHTML=`<header class="site-header"><div class="inner"><div class="brand"><div class="brand-symbol">宅</div><div><div class="brand-title">消して覚える <span style="opacity:.5;font-weight:400">/</span> 宅建</div><div class="brand-sub">覚える核心 × 応用力チェック</div></div></div><nav class="topnav" aria-label="メインメニュー"><button data-view="cards" class="${state.view==='cards'?'active':''}">覚えるシート</button><button data-view="practice" class="${state.view==='practice'?'active':''}">ランダム演習</button><button data-view="data" class="${state.view==='data'?'active':''}">問題の追加・保存</button></nav></div></header><main class="shell view-${state.view} mobile-${state.mobileMode}"><div class="hero"><div><div class="eyebrow">YOUR REVIEW WORKSPACE</div><h1>${state.view==='cards'?'間違えた問題を、得点できる知識へ':state.view==='practice'?'別の聞かれ方で、実力を確認':'問題データを増やす・バックアップ'}</h1><p>${state.view==='cards'?'問題文 → 判断 → 最小限の判断語 → 応用力チェック':state.view==='practice'?'登録済みの応用問題を、出題順を変えて演習':'GitHubで公開した問題は自動で追加。進捗はこのブラウザ内に保存されます。'}</p></div><div class="pill">オフライン対応・アカウント不要</div></div>${state.view==='cards'?renderCards(c):state.view==='practice'?renderPractice():renderData()}<div class="footer">2026 宅建試験対策 / 個人学習用の試作アプリ　・　著作物の問題文は個人利用の範囲で管理してください。<br>${canPersist?'この端末のブラウザ内に保存':'保存できない環境です。データを書き出してください。'}　・　別の端末との同期はありません。</div></main><nav class="mobile-bottom-nav" aria-label="スマートフォン用メニュー"><button data-action="mobile-list" class="${state.view==='cards'&&state.mobileMode==='list'?'active':''}" aria-label="問題一覧" aria-current="${state.view==='cards'&&state.mobileMode==='list'?'page':'false'}"><span class="nav-icon">☷</span>一覧</button><button data-action="mobile-sheet" class="${state.view==='cards'&&state.mobileMode==='detail'?'active':''}" aria-label="覚えるシート"><span class="nav-icon">▤</span>シート</button><button data-view="practice" class="${state.view==='practice'?'active':''}" aria-label="ランダム演習"><span class="nav-icon">◎</span>演習</button><button data-view="data" class="${state.view==='data'?'active':''}" aria-label="追加と保存"><span class="nav-icon">＋</span>追加・保存</button></nav>`;
}
function renderStats(c){return `<section class="stats" aria-label="学習状況"><div class="stat"><label>登録問題</label><strong>${c.total}</strong><small>覚えるシート</small></div><div class="stat"><label>理解できた ○</label><strong>${c.done}</strong><small>自己評価</small></div><div class="stat"><label>要復習 △・×</label><strong>${c.review}</strong><small>優先して復習</small></div><div class="stat"><label>応用問題</label><strong>${c.drills}</strong><small>○×形式</small></div></section>`}
function renderCards(c){const subjects=[...new Set(cards.map(x=>x.subject))];const available=filtered();const selected=current();return `<div class="cards-page mobile-${state.mobileMode}">${renderStats(c)}<div class="workspace mobile-${state.mobileMode}"><aside class="panel"><div class="side-head"><div class="section-title" style="margin:0 0 13px">問題一覧 <span class="pill" style="margin-left:auto">${available.length}件</span></div><div class="controls"><div class="search-field"><label class="label" for="search">キーワード検索</label><input class="control" id="search" data-control="search" placeholder="例：表見代理 / 問題14" value="${esc(state.search)}"></div><div><label class="label" for="subject">科目</label><select class="control" id="subject" data-control="subject"><option value="all">すべて</option>${subjects.map(x=>`<option value="${esc(x)}" ${state.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label class="label" for="status">復習状況</label><select class="control" id="status" data-control="status">${[['all','すべて'],['unseen','未判定'],['good','○ できた'],['mid','△ 迷った'],['bad','× 間違えた']].map(([v,l])=>`<option value="${v}" ${state.status===v?'selected':''}>${l}</option>`).join('')}</select></div></div></div><div class="side-cards">${available.length?available.map(x=>`<button class="card-link ${state.selected===x.id?'selected':''}" data-select="${esc(x.id)}"><div class="line"><strong>${esc(x.title)}</strong><span class="dot ${cssStatus(x.status)}">${badge(x.status)}</span></div><small>${esc(x.subject)} / ${esc(x.unit)}</small><small>P${esc(x.pages)} · ${dateText(x.lastReviewed)}</small></button>`).join(''):'<div class="empty" style="grid-column:1/-1">該当する問題がありません。</div>'}</div></aside>${selected?renderSheet(selected):'<div class="panel empty"><strong>条件に一致する問題がありません</strong>検索やフィルターを変更してください。</div>'}</div></div>`}
function renderSheet(c){const reveal=!!state.reveal[c.id];const ac=state.answers[c.id]||{};const attempted=Object.keys(ac).length;const score=c.drills.filter(d=>ac[d.id]===d.correct).length;return `<article class="sheet" data-mobile-tab="${state.sheetTab}"><div class="sheet-header"><button class="mobile-back" data-action="mobile-list">〈 問題一覧へ</button><div class="crumb">${esc(c.subject)} / ${esc(c.unit)}　|　${esc(c.reference)}</div><div class="sheet-top"><div><h2>${esc(c.title)}</h2><div class="source">${esc(c.source)} / ${esc(c.pages)}頁</div></div><div class="progress-row"><span class="note">復習結果</span><div class="status-toggle">${[['good','○ できた'],['mid','△ 迷った'],['bad','× 間違えた']].map(([s,l])=>`<button class="btn btn-sm ${c.status===s?'selected-'+s:''}" data-status="${s}" data-card="${esc(c.id)}">${l}</button>`).join('')}</div></div></div></div><div class="mobile-study-tabs" role="tablist" aria-label="学習画面の切り替え"><button role="tab" aria-selected="${state.sheetTab==='problem'}" class="${state.sheetTab==='problem'?'active':''}" data-action="mobile-tab" data-tab="problem">① 問題</button><button role="tab" aria-selected="${state.sheetTab==='answer'}" class="${state.sheetTab==='answer'?'active':''}" data-action="mobile-tab" data-tab="answer">② 解説</button><button role="tab" aria-selected="${state.sheetTab==='drills'}" class="${state.sheetTab==='drills'?'active':''}" data-action="mobile-tab" data-tab="drills">③ 応用 <span class="mini-count">${attempted}/${c.drills.length}</span></button></div><div class="sheet-body"><div class="two-col"><section><h3 class="section-title"><span class="num">01</span> 問題文 <span style="color:#8b97a0;font-size:11px;font-weight:500">答えを見ずに判断</span></h3><div class="stem">${esc(c.stem)}</div>${c.choices.map(ch=>`<div class="choice"><span class="optno">${esc(ch.label)}</span><div class="choice-text">${esc(ch.text)}</div></div>`).join('')}${c.kind==='count-wrong'?'<p class="note">選択肢：(1)一つ　(2)二つ　(3)三つ　(4)四つ</p>':''}</section><section class="col-right"><h3 class="section-title"><span class="num">02</span> 最小限の判断語</h3>${reveal?`<div class="answer-card">${c.choices.map(ch=>`<div class="answer-row"><span class="answer-no">${esc(ch.label)}</span><span class="mark ${ch.correct?'good':'bad'}">${ch.correct?'○':'×'}</span><div class="cue">${esc(ch.cue)}</div></div>`).join('')}</div><div class="correct-pill">問題集の正解：${esc(c.answer)}</div><div class="core"><h4>覚える核心</h4>${c.core.map(x=>`<div>・${esc(x)}</div>`).join('')}</div><div class="compact-foot"><button class="btn btn-sm" data-action="hide" data-card="${esc(c.id)}">解説を隠す</button><span class="note">単語からルールを説明</span></div>`:`<div class="hidden-answer"><div style="font-size:27px;color:#53747b">◈</div><strong>まだ解説は表示していません</strong><p>問題文を読んで、正誤と理由を思い出してください。</p><button class="btn btn-primary" data-action="reveal" data-card="${esc(c.id)}">解説・核心を表示する</button></div>`}</section></div></div><section class="drills"><div class="drills-intro"><div><h3>応用力チェック <span class="pill" style="margin-left:5px">${c.drills.length}問</span></h3><p>別の聞かれ方でも正解できるか。回答後に正誤と理由を表示します。</p></div><span class="note">${attempted}/${c.drills.length} 回答　${score} 正解</span></div><div class="drill-list">${c.drills.map((d,i)=>{const a=ac[d.id];const answered=typeof a==='boolean';return `<div class="drill"><div class="drill-top"><span class="qtag">Q${i+1}</span><div class="drill-prompt">${esc(d.prompt)}</div></div><div class="drill-controls"><button class="btn btn-sm ${answered&&a===true?'picked':''}" data-drill="${esc(d.id)}" data-card="${esc(c.id)}" data-value="true" ${answered?'disabled':''}>○ 正しい</button><button class="btn btn-sm ${answered&&a===false?'picked':''}" data-drill="${esc(d.id)}" data-card="${esc(c.id)}" data-value="false" ${answered?'disabled':''}>× 誤り</button></div>${answered?`<div class="feedback ${a===d.correct?'ok':'ng'}"><b>${a===d.correct?'正解':'不正解'}・答え ${d.correct?'○':'×'}</b>${esc(d.explanation)}</div>`:''}</div>`}).join('')}</div><div class="compact-foot"><span class="note">問題に慣れてしまった場合は「ランダム演習」も使用</span><button class="btn btn-sm" data-action="reset-drills" data-card="${esc(c.id)}">この応用問題をやり直す</button></div></section><div class="mobile-card-nav"><button data-action="mobile-prev" ${filtered().findIndex(v=>v.id===c.id)<=0?'disabled':''}>← 前の問題</button><button data-action="mobile-next" ${filtered().findIndex(v=>v.id===c.id)>=filtered().length-1?'disabled':''}>次の問題 →</button></div></article>`}
function makePractice(){let p=[];for(const c of cards)for(const d of c.drills)p.push({cardId:c.id,cardTitle:c.title,subject:c.subject,...d});for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}state.practice=p;state.practiceIndex=0;state.practiceAnswer=null;state.practiceScore=0}
function renderPractice(){if(!state.practice.length)return `<div class="section-page"><div class="quiz-shell"><h2>ランダム演習</h2><p class="section-subtle">登録された問題から応用問題を出題します。開始するまで採点はしません。</p><div class="stats" style="margin-top:24px;max-width:650px">${['登録カード','応用問題'].map((l,i)=>`<div class="stat"><label>${l}</label><strong>${i===0?cards.length:cards.reduce((a,c)=>a+c.drills.length,0)}</strong></div>`).join('')}</div><button class="btn btn-primary" data-action="start-practice">演習を開始する</button></div></div>`;
const {practice:p,practiceIndex:i,practiceAnswer:a,practiceScore:score}=state;if(i>=p.length)return `<div class="section-page"><div class="quiz-shell" style="text-align:center"><div class="eyebrow">FINISHED</div><h2>演習完了</h2><div style="font-size:56px;font-weight:800;margin:20px 0 0">${score}<span style="font-size:25px;color:var(--muted)"> / ${p.length}</span></div><p class="section-subtle">問題ごとの再確認は「覚えるシート」で行えます。</p><button class="btn btn-primary" data-action="start-practice">もう一度出題する</button><button class="btn" data-view="cards" style="margin-left:9px">シートに戻る</button></div></div>`;
const q=p[i];return `<div class="section-page"><div class="quiz-shell"><div class="quiz-header"><span class="crumb">${esc(q.cardTitle)} / ${esc(q.subject)}</span><strong>${i+1} / ${p.length}</strong></div><div class="mini-bar"><div style="width:${(i/p.length)*100}%"></div></div><h2 style="margin:0 0 16px">この文章は正しい？</h2><p class="quiz-question">${esc(q.prompt)}</p><div class="quiz-buttons"><button class="btn" data-action="practice-answer" data-value="true" ${a!==null?'disabled':''}>○ 正しい</button><button class="btn" data-action="practice-answer" data-value="false" ${a!==null?'disabled':''}>× 誤り</button></div>${a!==null?`<div class="quiz-result ${a===q.correct?'':'bad'}"><h3>${a===q.correct?'正解':'不正解'}　/　正答 ${q.correct?'○':'×'}</h3><p>${esc(q.explanation)}</p><div class="quiz-actions"><button class="btn btn-primary" data-action="next-practice">${i+1===p.length?'結果を見る':'次の問題へ'} →</button><button class="btn" data-action="jump-card" data-card="${esc(q.cardId)}">この論点を復習</button></div></div>`:''}<div class="compact-foot"><span class="note">正答済み ${score}問</span><button class="btn btn-sm btn-ghost" data-action="cancel-practice">演習を終了</button></div></div></div>`}
function renderData(){return `<div class="section-page"><div class="data-cards"><section class="data-panel"><h3>① 問題を取り込む（予備の方法）</h3><p>GitHubの data/cards.json に登録した問題は、オンラインで開くと自動追加されます。ここでは個別のJSONも手動で登録できます。</p><textarea class="codefield" id="importField" spellcheck="false" aria-label="登録用JSON" placeholder='{"cards":[{"id":"...", "title":"...", ...}]}'></textarea><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn btn-primary" data-action="import-json">JSONを読み込む</button><button class="btn" data-action="copy-prompt">ChatGPTへの依頼文をコピー</button><button class="btn" data-action="download-template">登録テンプレート</button></div><p class="help-list" style="margin-top:12px">インポート形式：カード1件、配列、または <code>{"cards":[...]}</code> のいずれか。<br>必須：id / subject / unit / title / stem / choices / drills。<br>画像をアプリに直接送るAI解析機能はありません。</p></section><section class="data-panel"><h3>② データを保存・復元する</h3><p>復習状況も含めてJSONでバックアップできます。別の端末へ移すときは書き出したファイルを読み込んでください。</p><div style="display:grid;gap:10px"><button class="btn btn-accent" data-action="export-json">全データを書き出す（JSON）</button><label class="btn" style="display:block;text-align:center" for="uploadFile">JSONファイルから読み込む</label><input type="file" id="uploadFile" accept="application/json,.json" hidden><div class="save-indicator">${canPersist?'このブラウザの保存領域を利用中':'ブラウザ保存に失敗'}</div></div><div class="alert"><b>重要：</b>この試作はサーバーにデータを送りません。ブラウザの保存データを削除すると記録が消えることがあります。定期的に「全データを書き出す」でバックアップしてください。</div><div style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px"><h3 style="font-size:13px;margin:0 0 6px">初期問題に戻す</h3><p style="font-size:12px;margin-bottom:11px">追加した問題や復習記録は消えます。バックアップ後に使ってください。</p><button class="btn btn-sm" data-action="reset-all">初期データへ戻す</button></div></section></div><div class="data-panel" style="margin-top:16px"><h3>③ すぐに1問だけ登録（手入力）</h3><p>問題文と判断語、応用チェックを自分で入力する簡易フォームです。問題集の丸写しではなく要約も登録できます。</p><form id="addCardForm" class="form-grid"><div class="field"><label for="f-title">タイトル</label><input required class="control" name="title" id="f-title" placeholder="例：問題16｜代理権の消滅"></div><div class="field"><label for="f-unit">単元</label><input required class="control" name="unit" id="f-unit" placeholder="例：代理・表見代理"></div><div class="field"><label for="f-subject">科目</label><select class="control" name="subject" id="f-subject"><option>権利関係</option><option>宅建業法</option><option>法令上の制限</option><option>税・その他</option></select></div><div class="field"><label for="f-pages">問題集のページ</label><input class="control" name="pages" id="f-pages" placeholder="例：258〜259"></div><div class="field full"><label for="f-answer">元問題の正解（任意）</label><input class="control" id="f-answer" name="answer" placeholder="例：(1) ／ (2) 二つ（ア・エ）"><span class="helper">未入力の場合、×の肢番号を表示します。</span></div><div class="field full"><label for="f-stem">問題文</label><textarea required class="control" id="f-stem" name="stem" rows="3" placeholder="答えを見ずに判断するための問題文"></textarea></div><div class="field full"><label for="f-choices">肢・判断語</label><textarea required class="control" id="f-choices" name="choices" rows="4" placeholder="(1) | × | 問題文の選択肢 | 判断語\n(2) | ○ | 問題文の選択肢 | 判断語"></textarea><span class="helper">1行につき「肢番号 | ○か× | 選択肢本文 | 判断語」</span></div><div class="field full"><label for="f-core">覚える核心</label><textarea required class="control" id="f-core" name="core" rows="3" placeholder="原則・要件・例外を1行ずつ"></textarea></div><div class="field full"><label for="f-drills">応用力チェック</label><textarea required class="control" id="f-drills" name="drills" rows="4" placeholder="別の聞かれ方の文章 | ○ | なぜ正しいか\n別の聞かれ方の文章 | × | なぜ誤りか"></textarea><span class="helper">1行につき「○×問題 | ○か× | 理由」</span></div><div class="field full"><button class="btn btn-primary" type="submit">この問題を登録</button></div></form></div></div>`}
function updateCardStatus(id,status){const c=cards.find(x=>x.id===id);if(!c)return;c.status=status;c.lastReviewed=new Date().toISOString();save();render();toast(`「${c.title}」を ${badge(status)} で記録しました。`)}
function setSelected(id){state.selected=id;state.reveal[id]=false;state.sheetTab='problem';if(isMobile())state.mobileMode='detail';render();window.scrollTo({top:0,behavior:'instant'})}
function useDrill(id,drillId,value){const c=cards.find(x=>x.id===id);const d=c?.drills.find(x=>x.id===drillId);if(!d)return;const a=state.answers[id]??={};if(typeof a[drillId]==='boolean')return;a[drillId]=value;c.attempts++;if(value===d.correct)c.correctAnswers++;c.lastReviewed=new Date().toISOString();save();render()}
function download(text,filename,type='application/json'){const blob=new Blob([text],{type:type+';charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(raw){let obj;try{obj=JSON.parse(raw)}catch(e){throw Error('JSONとして読めません。括弧・カンマを確認してください。')}const list=Array.isArray(obj)?obj:Array.isArray(obj?.cards)?obj.cards:[obj];if(!list.length)throw Error('カードがありません。');if(list.length>1000)throw Error('一度に取り込めるのは1000件までです。');const fresh=list.map(normalizeCard);let added=0,updated=0;for(const c of fresh){const idx=cards.findIndex(v=>v.id===c.id);if(idx>=0){const old=cards[idx];cards[idx]={...c,status:('status'in (list.find(x=>x.id===c.id)||{}))?c.status:old.status,attempts:('attempts'in (list.find(x=>x.id===c.id)||{}))?c.attempts:old.attempts,correctAnswers:('correctAnswers'in (list.find(x=>x.id===c.id)||{}))?c.correctAnswers:old.correctAnswers,lastReviewed:('lastReviewed'in (list.find(x=>x.id===c.id)||{}))?c.lastReviewed:old.lastReviewed};updated++}else{cards.push(c);added++}}save();state.view='cards';state.subject='all';state.status='all';state.search='';state.selected=fresh[0].id;state.mobileMode='detail';state.sheetTab='problem';render();toast(`${added}件を追加、${updated}件を更新しました。`)}
const exampleCard={id:'rights-agency-16',subject:'権利関係',unit:'代理',title:'問題16｜登録例',source:'2026年度版 みんなが欲しかった！宅建士の論点別過去問題集',reference:'',pages:'258〜259',kind:'choose-wrong',stem:'問題文を記入',choices:[{label:'(1)',text:'選択肢を記入',correct:false,cue:'判断語を記入'}],answer:'(1)',core:['原則 → 例外'],drills:[{id:'d1',prompt:'応用の○×問題',correct:false,explanation:'判断理由'}]};
const importPrompt=`次に添付する「2026年度版 みんなが欲しかった！宅建士の論点別過去問題集」の写真を分析し、私の宅建「消して覚える」アプリに追加するJSONを作成してください。\n要件：①原本の問題内容を確認し、各肢の正誤を正確に判断する ②原則・条件・例外を失わない最小限の判断語を各肢に付ける ③覚える核心を3〜5個に整理する ④同じ知識を別の聞かれ方で問うオリジナル○×問題を3〜5問と短い理由付きで作る ⑤推測で埋めず、不明点は先に確認する ⑥JSONのみをコードブロックで出力し、形式は下記のテンプレートに合わせる。\n${JSON.stringify(exampleCard,null,2)}\n注意：各 choices の correct は肢の記述そのものが正しければ true、誤りなら false。drills.correct も同様。id は重複しない英数字。写真から読み取れない箇所は創作しないこと。`;
function addManual(form){const fd=new FormData(form);const parse=(s)=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const entries=parse(fd.get('choices')).map((x,i)=>{const seg=x.split('|').map(y=>y.trim());if(seg.length<4||!['○','×'].includes(seg[1]))throw Error(`肢の${i+1}行目：番号 | ○× | 本文 | 判断語 にしてください。`);return{label:seg[0],correct:seg[1]==='○',text:seg[2],cue:seg.slice(3).join(' | ')}});const drills=parse(fd.get('drills')).map((x,i)=>{const seg=x.split('|').map(y=>y.trim());if(seg.length<3||!['○','×'].includes(seg[1]))throw Error(`応用問題の${i+1}行目：問題文 | ○× | 理由 にしてください。`);return{id:`d${i+1}`,prompt:seg[0],correct:seg[1]==='○',explanation:seg.slice(2).join(' | ')}});const c={id:`manual_${Date.now()}`,title:String(fd.get('title')).trim(),subject:String(fd.get('subject')),unit:String(fd.get('unit')).trim(),source:'手入力',pages:String(fd.get('pages')||''),stem:String(fd.get('stem')),choices:entries,core:parse(fd.get('core')),drills,kind:'other',answer:String(fd.get('answer')||'').trim()||entries.filter(x=>!x.correct).map(x=>x.label).join('・')};const n=normalizeCard(c);cards.push(n);save();state.view='cards';state.selected=n.id;state.mobileMode='detail';state.sheetTab='problem';state.subject='all';state.status='all';state.search='';render();toast('新しい問題を登録しました。')}
app.addEventListener('click',async e=>{const btn=e.target.closest('button[data-view],button[data-select],button[data-action],button[data-status],button[data-drill]');if(!btn)return;const {view,select,action,card,status,drill,value,tab}=btn.dataset;if(view){state.view=view;if(view==='cards'&&isMobile())state.mobileMode='list';render();window.scrollTo({top:0,behavior:'instant'});return}if(select){setSelected(select);return}if(status){const y=window.scrollY;updateCardStatus(card,status);window.scrollTo({top:y,behavior:'instant'});return}if(drill){const y=window.scrollY;useDrill(card,drill,value==='true');window.scrollTo({top:y,behavior:'instant'});return}
try{switch(action){case 'mobile-list':state.view='cards';state.mobileMode='list';render();window.scrollTo({top:0,behavior:'instant'});break;case 'mobile-sheet':state.view='cards';state.mobileMode='detail';render();window.scrollTo({top:0,behavior:'instant'});break;case 'mobile-tab':state.sheetTab=['problem','answer','drills'].includes(tab)?tab:'problem';if(state.sheetTab==='answer')state.reveal[state.selected]=true;render();window.scrollTo({top:0,behavior:'instant'});break;case 'mobile-prev':case 'mobile-next':{const list=filtered(),i=list.findIndex(v=>v.id===state.selected);const target=list[i+(action==='mobile-next'?1:-1)];if(target)setSelected(target.id);break;}case 'reveal':state.reveal[card]=true;render();break;case 'hide':state.reveal[card]=false;render();break;case 'reset-drills':delete state.answers[card];render();toast('応用問題を未回答に戻しました（過去の解答数は保持）。');break;case 'start-practice':makePractice();render();break;case 'practice-answer':if(state.practiceAnswer!==null)return;state.practiceAnswer=value==='true';if(state.practiceAnswer===state.practice[state.practiceIndex].correct)state.practiceScore++;render();break;case 'next-practice':state.practiceIndex++;state.practiceAnswer=null;render();break;case 'cancel-practice':state.practice=[];state.view='cards';render();break;case 'jump-card':state.practice=[];state.view='cards';state.selected=card;state.mobileMode='detail';state.sheetTab='problem';state.subject='all';state.status='all';state.search='';render();break;case 'export-json':download(JSON.stringify({version:APP_VERSION,exportedAt:new Date().toISOString(),cards},null,2),`宅建_消して覚える_バックアップ_${new Date().toISOString().slice(0,10)}.json`);toast('バックアップを保存しました。');break;case 'download-template':download(JSON.stringify({cards:[exampleCard]},null,2),'宅建_登録用テンプレート.json');break;case 'copy-prompt':if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(importPrompt);toast('依頼文をコピーしました。次の写真と一緒にChatGPTへ送ってください。')}else{const t=document.getElementById('importField');t.value=importPrompt;t.focus();t.select();toast('依頼文を入力欄に表示しました。選択してコピーしてください。')}break;case 'import-json':importData(document.getElementById('importField').value);break;case 'reset-all':if(confirm('追加問題と復習状況をすべて消し、問題14・15だけに戻しますか？\n先にJSONバックアップを作成してください。')){cards=clone(seed);state.selected=cards[0].id;state.answers={};state.reveal={};state.view='cards';state.subject='all';state.status='all';state.search='';save();render();toast('初期状態に戻しました。')}break;default:break}}catch(err){toast(err.message||'操作に失敗しました。',true)}
});
app.addEventListener('change',async e=>{const el=e.target;if(el.dataset.control==='search')return;if(el.dataset.control){state[el.dataset.control]=el.value;render();return}if(el.id==='uploadFile'&&el.files?.[0]){try{const s=await el.files[0].text();importData(s)}catch(err){toast(err.message,true)}}});
app.addEventListener('input',e=>{if(e.target.dataset.control==='search'){state.search=e.target.value;const list=filtered();const box=app.querySelector('.side-cards');if(box)box.innerHTML=list.length?list.map(x=>`<button class="card-link ${state.selected===x.id?'selected':''}" data-select="${esc(x.id)}"><div class="line"><strong>${esc(x.title)}</strong><span class="dot ${cssStatus(x.status)}">${badge(x.status)}</span></div><small>${esc(x.subject)} / ${esc(x.unit)}</small><small>P${esc(x.pages)} · ${dateText(x.lastReviewed)}</small></button>`).join(''):'<div class="empty">該当する問題がありません。</div>';const count=app.querySelector('.side-head .pill');if(count)count.textContent=`${list.length}件`}});
app.addEventListener('submit',e=>{if(e.target.id==='addCardForm'){e.preventDefault();try{addManual(e.target)}catch(err){toast(err.message,true)}}});
save();render();
syncPublishedCards();
})();
</script>
</body>
</html>
